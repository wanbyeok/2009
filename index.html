<script>

/* 아이콘 */

 const c=D[k][i];c._ty=0;c.msgs.push(['them',text,stamp()]);c.t=stamp();
 const el=cur(),open=ov.classList.contains('on');
 if(open&&el&&el.dataset.id==`${k}:${i}`){live(k,i,1);return}
 c.u=(c.u||(c.un?1:0))+1;c.un=0;
 if(open)notify(k,i,text);
 if(el&&el.dataset.id==`${k}:list`)A[k]();
 else if(el&&el.dataset.t=='home')el.innerHTML=homeHTML();
}
function sched(key){const P=PHONES[key];if(P._s)return;P._s=1;(P.incoming||[]).forEach(m=>setTimeout(()=>receive(m.app,m.chat,m.text),m.at*1000))}
const ov=$('#ov');
$('#story').innerHTML=STORY;document.title=TITLE;
document.addEventListener('click',e=>{const a=e.target.closest('[data-phone]');if(!a)return;e.preventDefault();if(!PHONES[a.dataset.phone])return;setPhone(a.dataset.phone);sched(a.dataset.phone);ov.classList.add('on');scr.innerHTML='';busy=false;scr.style.pointerEvents='';home()});
$('#x').onclick=()=>ov.classList.remove('on');
scr.addEventListener('pointerdown',e=>{const a=e.target.closest('.a,.wg'),b=scr.getBoundingClientRect();if(a){const q=(a.querySelector('.ic')||a).getBoundingClientRect();origin=[(q.left+q.width/2-b.left)/b.width*100,(q.top+q.height/2-b.top)/b.height*100]}ex=e.clientX-b.left<24?e.clientX:null});
scr.addEventListener('pointerup',e=>{if(ex!=null&&e.clientX-ex>70&&!busy){const k=scr.querySelector('.ly:last-child .bk');if(k)k.click()}ex=null});
const hi=$('#hi');let y0=0;
hi.onpointerdown=e=>{y0=e.clientY;try{hi.setPointerCapture(e.pointerId)}catch(_){}};
hi.onpointerup=e=>{const dy=e.clientY-y0;if(dy<-18||Math.abs(dy)<6){const c=scr.querySelector('.ly:last-child');if(c&&c.dataset.t!='home'&&!busy)home()}};
</script>
