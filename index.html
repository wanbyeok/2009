const stamp=()=>{const [h,m]=tmv();return `${h<12?'오전':'오후'} ${h%12||12}:${p2(m)}`};
const smsH=c=>{const L=c.msgs,l=L[L.length-1];return `<div class="dt">${stamp()}</div>${L.map((m,j)=>`<div class="b ${m[0]}${!L[j+1]||L[j+1][0]!=m[0]?' tt':''}">${m[1]}</div>`).join('')}${c._ty?`<div class="b them tt ty"><i></i><i></i><i></i></div>`:''}${l&&l[0]=='me'?`<div class="rd">${c._ty?'읽음':'전달됨'}</div>`:''}`};
const kkH=c=>{let pv='';return c.msgs.map((m,j)=>{const nx=c.msgs[j+1],first=m[0]!=pv,last=!nx||nx[0]!=m[0],tm=last&&m[2]?`<small>${m[2]}</small>`:'';pv=m[0];
 return m[0]=='me'?`<div class="kr me">${tm}<div class="b">${m[1]}</div></div>`:`<div class="kr"><div class="ka ${first?'':'n'}">${first?AV:''}</div><div>${first?`<small class="kn">${c.n}</small>`:''}<div class="kb"><div class="b">${m[1]}</div>${tm}</div></div></div>`}).join('')+(c._ty?`<div class="kr"><div class="ka n"></div><div class="b ty"><i></i><i></i><i></i></div></div>`:'')};
function live(k,i,fresh){
 const el=cur();if(!el||el.dataset.id!=`${k}:${i}`)return;
 const ch=el.querySelector('.chat'),b=el.querySelector('.body');
 ch.innerHTML=(k=='sms'?smsH:kkH)(D[k][i]);
 if(fresh){const bs=ch.querySelectorAll('.b:not(.ty)');bs.length&&bs[bs.length-1].classList.add('new')}
 b.scrollTo({top:b.scrollHeight,behavior:'smooth'});
}
function send(k,i,f){
 const inp=f.querySelector('input'),t=inp.value.trim();if(!t)return false;
 const c=D[k][i];c.msgs.push(['me',t,stamp()]);c.t=stamp();inp.value='';
 live(k,i,1);
 const r=c.reply;
 if(r&&(c._r||0)<r.length){const x=r[c._r||0];c._r=(c._r||0)+1;
  TM.push(setTimeout(()=>{c._ty=1;live(k,i)},700));
  TM.push(setTimeout(()=>receive(k,i,x),1800+Math.random()*900))}
 return false;
}

function ringIn(n,line,sec){const L=line?[].concat(line):[];
 if(CL)return;

 const sl=document.getElementById('sl'),kn=sl.querySelector('.kn2');let x0=null;
 const max=()=>sl.clientWidth-64;
 kn.onpointerdown=e=>{x0=e.clientX;try{kn.setPointerCapture(e.pointerId)}catch(_){}kn.style.transition='none'};
 kn.onpointermove=e=>{if(x0==null)return;const k=ph_k();const dx=Math.max(0,Math.min(max(),(e.clientX-x0)/k));kn.style.transform=`translateX(${dx}px)`;kn._dx=dx};
 kn.onpointerup=kn.onpointercancel=()=>{if(x0==null)return;x0=null;kn.style.transition='transform .25s';if((kn._dx||0)>max()*.7){answerIn()}else{kn.style.transform='';kn._dx=0}};

 CL.t1=setTimeout(()=>{if(CL&&CL.st=='ring')endCall(0,1)},sec?sec*1000:25000);
}
const ph_k=()=>{const r=document.getElementById('ph').getBoundingClientRect();return r.width/document.getElementById('ph').offsetWidth||1};
function answerIn(){
 if(!CL||CL.st!='ring')return;clearTimeout(CL.t1);const n=CL.n;
 cl().innerHTML=`<div class="cs"><div class="cn">${esc(n)}</div><div class="cst" id="cst"></div><div class="cap">휴대전화</div><div class="line" id="ln"></div><div class="cgrid">${callBtns()}</div><button class="endb" onclick="endCall()">${PH}</button></div>`;
 connect();
 const L=CL.L||[];L.forEach((t,k)=>{CL['t'+k]=setTimeout(()=>{const e=document.getElementById('ln');if(e&&CL){e.style.animation='none';void e.offsetWidth;e.style.animation='';e.textContent='“'+t+'”'}},1200+k*3800)});
}
function endCall(silent,missed){
 if(!CL)return;const C=CL;CL=null;clearTimeout(C.t1);clearInterval(C.iv);Object.keys(C).forEach(k=>/^t\d+$/.test(k)&&clearTimeout(C[k]));
 const c=cl();
 if(silent){c.classList.remove('on');c.innerHTML='';return}
 const miss=C.st=='ring'&&C.dir=='in';
 if(C.st!='on'&&!miss&&C.dir=='out'){/* 연결 전에 끊음 */}
 D.calls.unshift({n:C.n,dir:C.dir,t:t12(),miss:miss?1:0,type:'휴대전화'});
 const s=c.querySelector('.cst');if(s&&C.st=='on')s.textContent='통화 종료';
 setTimeout(()=>{c.classList.remove('on');setTimeout(()=>{if(!CL)c.innerHTML=''},400);refreshAfterCall()},C.st=='on'?700:0);
}

/* ---- 잠금화면 ---- */
const lkEl=()=>document.getElementById('lk');
function lockHTML(){
 const W=(D.lock&&D.lock.widget)||(()=>{const e=nxEvents()[0];if(!e)return {t:'일정 없음',v:'—'};const n=Math.round((new Date(e.d)-new Date(D.today))/864e5);return {t:e.t,v:n<=0?'오늘':'D-'+n}})();
 const al=(D.lock&&D.lock.alarm)||'6:00',mu=D.music?D.music.title:'음악';
 const dots=[0,1,2,3].map(()=>'<i></i>').join('');
 const K=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']];
 return `<div class="lkm" id="lkm"><div class="lki">${S('<rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3"/>',2)}</div>
  <div class="lkd">${M}월 ${Dd}일 (${wd[dow]})</div><div class="lkt">${t12()}</div>
  <div class="lkw"><div class="wr"><small>${esc(W.t)}</small><b>${esc(W.v)}</b></div><div class="wc">${I.note}<span>${esc(mu)}</span></div><div class="wc">${S('<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M4 6l3-3M20 6l-3-3"/>',2)}<span>${esc(al)}</span></div></div>
  <div class="lkb" style="left:42px">${S('<path d="M9 3h6v4l-1 2v12H10V9L9 7z" fill="currentColor"/>',1.6)}</div><div class="lkb" style="right:42px">${S('<path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="currentColor"/><circle cx="12" cy="13" r="3.2" fill="#000"/>',1.4)}</div>
  <div class="lkh" onclick="lkPass()">위로 쓸어올려 열기</div></div>
  <div class="lkp"><div class="pt">암호 입력</div><div class="dots" id="dots">${dots}</div>
  <div class="kp">${K.map(([a,b])=>`<div onclick="lkKey()">${a}<small>${b}</small></div>`).join('')}<div class="z" onclick="lkKey()">0<small></small></div></div>
  <div class="em">긴급 상황</div><div class="cn2" id="cn2" onclick="lkCancel()">취소</div></div>`}
function showLock(){
 if(D.lock===false){LK=0;return}
 LK=1;pin=0;const e=lkEl();e.className='on';e.innerHTML=lockHTML();document.getElementById('sc').classList.add('lk');
 const m=e.querySelector('.lkm');let y0=null;
 m.onpointerdown=ev=>{y0=ev.clientY};
 m.onpointerup=ev=>{if(y0!=null&&(ev.clientY-y0)/ph_k()<-50)lkPass();y0=null};
}
function hideLockNow(){LK=0;pin=0;const e=lkEl();if(!e)return;e.className='';e.innerHTML='';document.getElementById('sc').classList.remove('lk','pw')}
function lkPass(){if(LK!=1)return;LK=2;pin=0;lkDots();lkEl().classList.add('pass');document.getElementById('sc').classList.add('pw')}
function lkDots(){const d=document.getElementById('dots');if(d)[...d.children].forEach((x,k)=>x.classList.toggle('f',k<pin));const c=document.getElementById('cn2');if(c)c.textContent=pin?'삭제':'취소'}
function lkKey(){if(LK!=2||pin>=4)return;pin++;lkDots();if(pin>=4)setTimeout(lkOpen,200)}
function lkCancel(){if(LK!=2)return;if(pin){pin--;lkDots();return}LK=1;lkEl().classList.remove('pass');document.getElementById('sc').classList.remove('pw')}
function lkOpen(){if(LK!=2)return;LK=0;const e=lkEl();e.classList.add('out');setTimeout(()=>{if(!LK)hideLockNow()},520)}
let ntT;const hideN=()=>$('#ntf').classList.remove('on');
function notify(k,i,text){
 const n=$('#ntf'),c=D[k][i];
 n.innerHTML=`<div class="ic" style="background:${BG[k]}">${IC[k]}</div><div class="nt"><small>${AP[k]}</small><b>${c.n}</b><span>${text}</span></div><em>지금</em>`;
 n.onclick=()=>{hideN();if(LK){lkPass();return}const a=scr.querySelector(`.a[data-app="${k}"]`),b=scr.getBoundingClientRect();if(a){const q=a.querySelector('.ic').getBoundingClientRect();origin=[(q.left+q.width/2-b.left)/b.width*100,(q.top+q.height/2-b.top)/b.height*100]}A[k](i)};
 n.classList.add('on');clearTimeout(ntT);ntT=setTimeout(hideN,4500);
 navigator.vibrate&&navigator.vibrate(40);
}
function receive(k,i,text){
 const c=D[k][i];c._ty=0;c.msgs.push(['them',text,stamp()]);c.t=stamp();
 const el=cur(),open=ov.classList.contains('on');
 if(open&&el&&el.dataset.id==`${k}:${i}`){live(k,i,1);return}
 c.u=(c.u||(c.un?1:0))+1;c.un=0;
 if(open)notify(k,i,text);
 if(el&&el.dataset.id==`${k}:list`)A[k]();
 else if(el&&el.dataset.t=='home')el.innerHTML=homeHTML();
}
/* incoming의 name(이름)으로 대화를 찾아요. 없는 이름이면 새 대화가 생겨요. (name 없이 chat 번호를 써도 돼요) */
function whoIdx(m){if(m.name==null)return m.chat;let i=D[m.app].findIndex(c=>c.n==m.name);if(i<0){D[m.app].push({n:m.name,t:stamp(),msgs:[]});i=D[m.app].length-1}return i}
function sched(key){const P=PHONES[key];if(P._s)return;P._s=1;(P.incoming||[]).forEach(m=>TM.push(setTimeout(()=>m.app=='phone'?ringIn(m.name,m.line):receive(m.app,whoIdx(m),m.text),m.at*1000)))}
$('#story').innerHTML=STORY;document.title=TITLE;
document.addEventListener('click',e=>{const a=e.target.closest('[data-phone]');if(!a)return;e.preventDefault();if(!PHONES[a.dataset.phone])return;setPhone(a.dataset.phone);sched(a.dataset.phone);ov.classList.add('on');scr.innerHTML='';busy=false;scr.style.pointerEvents='';fit();home();showLock()});
$('#x').onclick=closePhone;
scr.addEventListener('pointerdown',e=>{const a=e.target.closest('.a,.wd'),b=scr.getBoundingClientRect();if(a){const q=(a.querySelector('.ic')||a).getBoundingClientRect();origin=[(q.left+q.width/2-b.left)/b.width*100,(q.top+q.height/2-b.top)/b.height*100]}ex=e.clientX-b.left<24?e.clientX:null});
scr.addEventListener('pointerup',e=>{if(ex!=null&&e.clientX-ex>70&&!busy){const k=scr.querySelector('.ly:last-child .bk');if(k)k.click()}ex=null});
const hi=$('#hi');let y0=0;
hi.onpointerdown=e=>{y0=e.clientY;try{hi.setPointerCapture(e.pointerId)}catch(_){}};
hi.onpointerup=e=>{const dy=e.clientY-y0;if(LK){if(LK==1&&(dy<-18||Math.abs(dy)<6))lkPass();return}if(dy<-18||Math.abs(dy)<6){const c=scr.querySelector('.ly:last-child');if(c&&c.dataset.t!='home'&&!busy)home()}};
</script>
